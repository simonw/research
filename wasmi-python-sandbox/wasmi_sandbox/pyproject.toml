[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "wasmi_sandbox"
version = "0.1.0"
description = "Run WebAssembly with wasmi 2.0 from Python, with fuel, wall-clock and memory limits"
requires-python = ">=3.9"
classifiers = ["Programming Language :: Rust", "Programming Language :: Python :: 3"]

[tool.maturin]
python-source = "python"
module-name = "wasmi_sandbox._core"
features = ["pyo3/extension-module"]
