[package]
name = "wasmi_sandbox"
version = "0.1.0"
edition = "2021"
description = "Python bindings for the wasmi 2.0 WebAssembly interpreter with fuel, time and memory limits"
license = "MIT OR Apache-2.0"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
wasmi = "2.0.0"
wat = "1"
stacker = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
